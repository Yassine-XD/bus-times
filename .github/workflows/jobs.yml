name: Collect job offers
on:
  schedule:
    # several runs a day: GitHub can start scheduled runs hours late, so one of the
    # night runs is always ready before the 08:47 alert; the afternoon run catches
    # offers posted during the day (they show in the next alert, never twice)
    - cron: "17 1 * * *"
    - cron: "41 3 * * *"
    - cron: "7 5 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:
  push:
    paths: ["jobs/collect.py", ".github/workflows/jobs.yml"]
concurrency: { group: jobs-feed, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }        # always start from the newest data, not the commit that queued the run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: collect
        run: python jobs/collect.py
      - name: smoke test
        run: python jobs/list.py --data jobs/data/offers.json --days 3 --text 0 | head -40
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/data
          git diff --cached --quiet || git commit -m "Job offers $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0   # another run saved first: keep this newer data
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          exit 1
